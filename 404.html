<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme-override");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 - Page not found | Ryan Yarali</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/typography.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=4" />
  </head>
  <body>
    <!-- Navigation -->
    <div id="site-navbar" data-nav-context="root"></div>

    <!-- Error Container -->
    <div class="error-page-container">
      <div class="error-page-content">
        <span class="error-page-code">404</span>
        <h1 class="error-page-title">Page not found</h1>
        <p class="error-page-message">
          This page doesn't exist, or the link that brought you here is
          outdated. Head back to the homepage or reach out if you think
          something's broken.
        </p>
        <div class="error-page-actions">
          <a href="index.html" class="btn btn-primary">Go home</a>
          <a href="index.html#contact" class="btn btn-secondary">Contact me</a>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
